# Reference: https://qlty.sh/d/qlty-toml
#
# Code-quality configuration for both the Qlty CLI and Qlty Cloud. Plugins and
# their lint and format rules come from the shared sinemacula/coding-standards
# source; this file wires that source in and adds what is specific to this
# repository.
config_version = "0"

exclude_patterns = [
    "*_min.*",
    "*-min.*",
    "*.min.*",
    "**/build/**",
    "**/cache/**",
    "**/coverage/**",
    "**/dist/**",
    "**/node_modules/**",
    "**/vendor/**",
    ".claude/**",
    ".qlty/configs/**",
    ".sinemacula/**",
]

test_patterns = [
    "**/test/**",
    "**/tests/**",
    "**/spec/**",
    "**/*.test.*",
    "**/*.spec.*",
    "**/*_test.*",
    "**/*_spec.*",
    "**/test_*.*",
    "**/spec_*.*",
]

[[source]]
name = "default"
default = true

[[source]]
name = "sinemacula"
repository = "https://github.com/sinemacula/coding-standards"
tag = "v1.30.0"

[[plugin]]
name = "php-codesniffer"
package_file = "composer.json"
package_filters = ["slevomat", "dealerdirect", "sinemacula"]

# The standards package is listed as an extra package rather than resolved from
# composer.json, because qlty ignores extra_packages whenever package_file is
# set on the same plugin.
[[plugin]]
name = "php-cs-fixer"
extra_packages = ["sinemacula/coding-standards@1.30.0"]

[[plugin]]
name = "phpstan"
package_file = "composer.json"

# The ext-valkey_glide stub declares the third-party extension class for IDE and
# static analysis only; its intentionally empty method bodies and load guard are
# not project code, so the lint/format plugins skip it. PHPStan still consumes it
# via bootstrapFiles/stubFiles (with stubs excluded from analysis) to resolve the
# \ValkeyGlide type.
[[exclude]]
plugins = ["php-cs-fixer", "php-codesniffer", "radarlint-php"]
file_patterns = ["stubs/**"]
