# ==============================================================================
# TESTS
# ==============================================================================
name: Tests

# ==============================================================================
# TRIGGERS
# ==============================================================================
on:
    push:
        branches: [ master ]
    pull_request:
        types: [ opened, synchronize, reopened, ready_for_review ]
    workflow_dispatch:

# ==============================================================================
# CONCURRENCY
# ==============================================================================
concurrency:
    group: tests-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

# ==============================================================================
# PERMISSIONS
# ==============================================================================
permissions:
    contents: read
    id-token: write

# ==============================================================================
# DEFAULTS
# ==============================================================================
defaults:
    run:
        shell: bash

jobs:

    # ==========================================================================
    # JOB: PHP TESTS
    # ==========================================================================
    php:
        name: Test / PHP ${{ matrix.php }}
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                php: [ 8.3, 8.4, 8.5 ]

        steps:
            -   name: Checkout
                uses: actions/checkout@v7
                with:
                    persist-credentials: false

            -   name: Setup PHP
                uses: sinemacula/.github/.github/actions/setup-php@v1.13.0
                with:
                    php-version: ${{ matrix.php }}

            -   name: PHPUnit
                run: composer test:coverage

            -   name: Benchmark smoke
                run: composer bench:smoke

            -   name: Publish code coverage
                if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && matrix.php == '8.3' }}
                uses: qltysh/qlty-action/coverage@c9b09987143d1e4ac955f4803c7bea742102feb5 # v2
                with:
                    oidc: true
                    files: clover.xml

    # ==========================================================================
    # JOB: LARAVEL TESTS
    # ==========================================================================
    laravel:
        name: Test / Laravel ${{ matrix.laravel.label }}
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                laravel:
                    -   constraint: ^12.0
                        label: 12
                    -   constraint: ^13.0
                        label: 13

        steps:
            -   name: Checkout
                uses: actions/checkout@v7
                with:
                    persist-credentials: false

            -   name: Setup PHP
                uses: sinemacula/.github/.github/actions/setup-php@v1.13.0
                with:
                    php-version: 8.3

            -   name: Pin Laravel version
                env:
                    LARAVEL_CONSTRAINT: ${{ matrix.laravel.constraint }}
                run: composer update --with="laravel/framework:${LARAVEL_CONSTRAINT}" --prefer-dist --no-interaction --no-progress

            -   name: PHPUnit
                run: composer test

            -   name: Benchmark smoke
                run: composer bench:smoke

    # ==========================================================================
    # JOB: LARAVEL FLOOR TESTS
    # ==========================================================================
    # Runs the suite on the lowest releases composer.json allows (illuminate/*
    # ^12.45 || ^13.0). Packagist security advisories cover every
    # laravel/framework release before 12.69.0, and 13.x before 13.30.0, so
    # Composer blocks installing these by default. This job alone stops those
    # advisories blocking laravel/framework, only to prove compatibility. Every
    # other job keeps blocking them, and nothing here changes how an
    # application's own Composer treats them.
    laravel-floor:
        name: Test / Laravel ${{ matrix.laravel }} floor (framework advisories ignored)
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                laravel: [ 12.45.0, 13.0.0 ]

        steps:
            -   name: Checkout
                uses: actions/checkout@v7
                with:
                    persist-credentials: false

            -   name: Setup PHP
                uses: sinemacula/.github/.github/actions/setup-php@v1.13.0
                with:
                    php-version: 8.3

            # Ignores advisories on laravel/framework for blocking only, so the
            # update still reports them; other packages' advisories and malware
            # stay blocked. It edits this runner's checkout of composer.json only.
            -   name: Stop advisories blocking laravel/framework (floor test only)
                run: >-
                    composer config --json policy.advisories.ignore
                    '{"laravel/framework": {"on-audit": false, "reason": "Floor compatibility test only"}}'

            -   name: Pin Laravel version
                env:
                    LARAVEL_VERSION: ${{ matrix.laravel }}
                run: composer update --with="laravel/framework:${LARAVEL_VERSION}" --prefer-dist --no-interaction --no-progress

            -   name: PHPUnit
                run: composer test

            -   name: Benchmark smoke
                run: composer bench:smoke
